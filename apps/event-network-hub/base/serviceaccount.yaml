# The backend's identity in AWS. Terraform-platform's
# module.event_network_hub_pod_identity binds exactly this name in exactly
# the env's namespace (development today) to a role that can read the RDS
# master password secret and read/write the app's bucket. Renaming it here
# silently removes that access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: event-network-hub-sa
  labels:
    app.kubernetes.io/name: backend
