# Settings that differ per environment (database, bucket, public URL) come
# from the backend-config ConfigMap each env generates. Secrets (bot token,
# SMTP, Slack, VAPID keys) are not set yet: those features stay off until
# platform/external-secrets exists and they are read from Secrets Manager.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  # Exactly one: every replica would run init_db and the background jobs
  # itself. Recreate (not RollingUpdate) so an old and a new pod never run
  # them at the same time during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      serviceAccountName: event-network-hub-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # APP_UID in backend/Dockerfile
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: backend
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: GOTENBERG_URL
              value: http://gotenberg:3000
            - name: DATA_DIR
              value: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            # init_db runs before the server answers.
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        # Local scratch only: files go to S3 when S3_BUCKET is set. Without
        # VAPID keys configured, the backend generates a key pair here, so
        # browser push subscriptions reset whenever the pod restarts.
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
